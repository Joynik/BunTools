[fmt]
sortImports = true
sortPackageJson = true
printWidth = 100
tabWidth = 4
useTabs = false
singleQuote = false
jsxSingleQuote = false
semi = true
bracketSpacing = true
trailingComma = "all"
endOfLine = "lf"

ignorePatterns = [
  "tests/fixtures/**",
  "**/*.md",
  "**/*.mdx",
  "**/*.toml",
  "**/dist/**",
  "**/build/**",
  "**/coverage/**",
  "**/templates/**",
  "dist/",
  "target/",
  "src-tauri/target/",
  "src-tauri/gen/",
]

[[fmt.overrides]]
files = ["tsconfig.json", "tsconfig.*.json", "tsconfig-*.json"]
options = { parser = "jsonc" }

[lint]
typeAware = false
typeCheck = false

ignorePatterns = [
  "tests/fixtures/**",
  "dist/**",
  "build/**",
  "coverage/**",
  "**/*.min.js",
  "dist/",
  "target/",
  "src-tauri/target/",
  "src-tauri/gen/",
]

[lint.categories]
correctness = "error"
suspicious = "warn"
perf = "warn"

[lint.rules]
"no-unused-vars" = "warn"
"no-debugger" = "error"
"no-console" = "off"
"eqeqeq" = "error"
"curly" = "error"

# Native discovery, workspace edits and cancellation require ordered operations.
"no-await-in-loop" = "off"
# Keep VS Code lifecycle helpers beside the state and actions they support.
"unicorn/consistent-function-scoping" = "off"
# TypeScript return types already permit explicit undefined results.
"consistent-return" = "off"
# Notification callbacks intentionally return no value.
"promise/always-return" = "off"

[test]
# These tests run inside VS Code through .vscode-test.mjs, not in Bun.
pathIgnorePatterns = ["tests/vscode/**"]
